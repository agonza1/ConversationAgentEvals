name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: python -m venv apps/api/.venv
      - run: apps/api/.venv/bin/python -m pip install -r apps/api/requirements.txt
      - run: npm run test:api
      - run: npm run test:benchmark-smoke
      - run: npm run test:voice-lab-proof
      - run: npm run build:web
