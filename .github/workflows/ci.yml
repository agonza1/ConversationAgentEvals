name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  speech-protocols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r apps/pipecat/requirements-speech-test.txt
      - run: python -m pytest apps/pipecat/test_speech_providers.py apps/pipecat/test_streaming_media.py -q

  api-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm audit --audit-level=critical
      - name: Verify Next.js ESLint parser
        run: >-
          node -e "require(require.resolve('eslint-config-next/parser', { paths: ['./apps/web'] }))"
      - run: npm run docker:check
      - run: python -m venv apps/api/.venv
      - run: apps/api/.venv/bin/python -m pip install -r apps/api/requirements.txt
      - run: apps/api/.venv/bin/python -m pip check
      - run: npm run test:api
      - name: Verify continuous audio mixer without a live voice stack
        run: |
          python -m venv "${RUNNER_TEMP}/cae-audio-tests"
          "${RUNNER_TEMP}/cae-audio-tests/bin/python" -m pip install -r apps/pipecat/requirements-audio-test.txt
          "${RUNNER_TEMP}/cae-audio-tests/bin/python" -m pytest apps/pipecat/test_continuous_audio.py -q
      - run: npm run test:benchmark-smoke
      - run: npm run test:voice-lab-proof
      - run: node --test scripts/waylo-dev-origins.test.js
      - run: node --test apps/web/tests/evidence-timeline.test.cjs apps/web/tests/assert-review-model.test.cjs apps/web/tests/next-proxy-timeout.test.cjs apps/web/tests/voice-call-status.test.cjs apps/web/tests/session-playback.test.cjs apps/web/tests/waylo-connection.test.cjs apps/web/tests/waylo-run-budget.test.cjs
      - run: npm run build:web
      - name: Install browser for workspace navigation regression tests
        run: npm exec --workspace apps/web -- playwright install --with-deps chromium
      - name: Verify workspace navigation and legacy links
        env:
          PLAYWRIGHT_REUSE_EXISTING_SERVER: "0"
        run: npm exec --workspace apps/web -- playwright test tests/workspace-navigation.spec.ts tests/product-flow.spec.ts tests/spec-generation-settings.spec.ts tests/chatgpt-judge-settings.spec.ts tests/settings-layout.spec.ts tests/speech-settings.spec.ts tests/results-pagination.spec.ts tests/assert-review-progress.spec.ts tests/run-detail-layout.spec.ts tests/waylo-connection.spec.ts tests/execution-launch.spec.ts tests/scenario-spoken-opener.spec.ts tests/waylo-reporting.spec.ts tests/waylo-live-listening.spec.ts --config playwright.config.ts --workers=1
