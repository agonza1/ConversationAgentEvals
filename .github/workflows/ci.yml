name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  speech-protocols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r apps/pipecat/requirements-speech-test.txt
      - run: python -m pytest apps/pipecat/test_speech_providers.py apps/pipecat/test_streaming_media.py apps/pipecat/test_background_noise.py -q

  api-and-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cae_test_hosted
          POSTGRES_USER: cae
          POSTGRES_PASSWORD: cae_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cae -d cae_test_hosted"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm audit --audit-level=critical
      - name: Verify Next.js ESLint parser
        run: >-
          node -e "require(require.resolve('eslint-config-next/parser', { paths: ['./apps/web'] }))"
      - run: npm run docker:check
      - run: python -m venv apps/api/.venv
      - run: apps/api/.venv/bin/python -m pip install -r apps/api/requirements.txt
      - run: apps/api/.venv/bin/python -m pip check
      - name: Verify Firebase isolation and concurrent BYOK execution on PostgreSQL
        env:
          CAE_TEST_POSTGRES_URL: postgresql://cae:cae_test_only@127.0.0.1:5432/cae_test_hosted
          PYTHONPATH: apps/api
        run: apps/api/.venv/bin/python -m pytest apps/api/tests/test_hosted_multiuser.py -q
      - run: npm run test:api
      - name: Verify continuous audio mixer without a live voice stack
        run: |
          python -m venv "${RUNNER_TEMP}/cae-audio-tests"
          "${RUNNER_TEMP}/cae-audio-tests/bin/python" -m pip install -r apps/pipecat/requirements-audio-test.txt
          "${RUNNER_TEMP}/cae-audio-tests/bin/python" -m pytest apps/pipecat/test_continuous_audio.py -q
      - run: npm run test:benchmark-smoke
      - run: npm run test:voice-lab-proof
      - run: node --test scripts/waylo-dev-origins.test.js
      - run: node --test scripts/continuous_microphone.test.mjs
      - run: node --test apps/web/tests/evidence-timeline.test.cjs apps/web/tests/assert-review-model.test.cjs apps/web/tests/next-proxy-timeout.test.cjs apps/web/tests/voice-call-status.test.cjs apps/web/tests/session-playback.test.cjs apps/web/tests/waylo-connection.test.cjs apps/web/tests/waylo-run-budget.test.cjs apps/web/tests/assisted-authoring-model.test.cjs apps/web/tests/evaluation-evidence.test.cjs
      - run: npm run build:web
      - name: Install browser for workspace navigation regression tests
        run: npm exec --workspace apps/web -- playwright install --with-deps chromium
      - name: Verify workspace navigation and legacy links
        env:
          PLAYWRIGHT_REUSE_EXISTING_SERVER: "0"
        run: npm exec --workspace apps/web -- playwright test tests/hosted-auth.spec.ts tests/workspace-navigation.spec.ts tests/product-flow.spec.ts tests/spec-generation-settings.spec.ts tests/chatgpt-judge-settings.spec.ts tests/settings-layout.spec.ts tests/speech-settings.spec.ts tests/results-pagination.spec.ts tests/assert-review-progress.spec.ts tests/assert-evidence-report.spec.ts tests/run-detail-layout.spec.ts tests/waylo-connection.spec.ts tests/execution-launch.spec.ts tests/scenario-spoken-opener.spec.ts tests/waylo-reporting.spec.ts tests/waylo-live-listening.spec.ts tests/assisted-authoring.spec.ts tests/imported-evidence-flow.spec.ts tests/score-upload.spec.ts --config playwright.config.ts --workers=1
      - name: Verify live listener ownership, fallback and recorded playback
        env:
          PLAYWRIGHT_REUSE_EXISTING_SERVER: "0"
        run: npm exec --workspace apps/web -- playwright test tests/runs-analysis.spec.ts --grep "listening falls back|WebRTC|HTTP fallback|playback pauses|completed replay|continuous .* call playback" --config playwright.config.ts --workers=1
