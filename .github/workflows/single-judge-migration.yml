name: Single judge migration verification

on:
  push:
    branches: [refactor/single-assert-judge-path]
    paths:
      - .github/workflows/single-judge-migration.yml
      - scripts/apply-single-judge-migration.py

permissions:
  contents: read

jobs:
  dependencies:
    if: github.repository == 'agonza1/ConversationAgentEvals' && github.event.head_commit.message == 'Prepare isolated migration test dependencies'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export pinned test dependencies
        run: |
          python -m pip download -r apps/api/requirements.txt -d /tmp/cae-wheels
          npm ci
          tar -czf /tmp/cae-node-modules.tar.gz node_modules apps/web/node_modules 2>/dev/null || test -f /tmp/cae-node-modules.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: cae-python-wheels
          path: /tmp/cae-wheels
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: cae-node-modules
          path: /tmp/cae-node-modules.tar.gz
          retention-days: 1
  prepare:
    if: github.repository == 'agonza1/ConversationAgentEvals' && github.ref == 'refs/heads/refactor/single-assert-judge-path' && github.event.head_commit.message != 'Prepare isolated migration test dependencies'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply migration candidate
        id: apply
        shell: bash
        run: |
          cp scripts/apply-single-judge-migration.py /tmp/apply-single-judge-migration.py
          python /tmp/apply-single-judge-migration.py --apply
      - name: Install dependencies
        run: |
          npm ci
          python -m venv apps/api/.venv
          apps/api/.venv/bin/python -m pip install -r apps/api/requirements.txt
          apps/api/.venv/bin/python -m pip check
      - name: API regression suite
        run: PYTHONPATH=apps/api apps/api/.venv/bin/python -m pytest apps/api/tests -q
      - name: Web model tests and build
        run: |
          node --test apps/web/tests/evidence-timeline.test.cjs apps/web/tests/assert-review-model.test.cjs
          npm run build:web
      - name: Publish tested candidate tree (no ref writes)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SOURCE_SHA: ${{ github.sha }}
        run: python /tmp/apply-single-judge-migration.py --publish-tree
