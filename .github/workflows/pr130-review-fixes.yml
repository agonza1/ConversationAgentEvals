name: Apply PR 130 review fixes

on:
  push:
    branches:
      - agent/use-assert-judge-button

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.event.head_commit.message == 'Retry PR 130 review test updates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/use-assert-judge-button
          fetch-depth: 0

      - name: Retarget existing run-analysis judge mocks
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/tests/runs-analysis.spec.ts')
          text = path.read_text(encoding='utf-8')

          old_route = "await page.route('**/api/product/judge'"
          new_route = "await page.route('**/api/assert/runs/**/conversations/**/judge'"
          route_count = text.count(old_route)
          if route_count != 4:
              raise SystemExit(f'expected 4 legacy judge route mocks, found {route_count}')
          text = text.replace(old_route, new_route)

          lines = text.splitlines()
          output: list[str] = []
          replaced = {
              'selected_conversation': 0,
              'adjudication': 0,
              'failed_conversation': 0,
          }
          index = 0

          while index < len(lines):
              line = lines[index]
              stripped = line.strip()

              if stripped == 'expect(judgeRequest).toMatchObject({':
                  preview = '\n'.join(lines[index:index + 12])
                  indent = line[:len(line) - len(line.lstrip())]
                  if "plan: 'free'" in preview and 'conversation_id: conversation.conversation_id' in preview:
                      end = index
                      while end < len(lines) and "not.toHaveProperty('report')" not in lines[end]:
                          end += 1
                      if end >= len(lines):
                          raise SystemExit('selected-conversation assertion block did not terminate')
                      output.append(f"{indent}expect(judgeRequest).toEqual({{ user_id: 'demo-user' }});")
                      replaced['selected_conversation'] += 1
                      index = end + 1
                      continue
                  if 'conversation_id: failedConversation.conversation_id' in preview:
                      end = index
                      while end < len(lines) and "not.toHaveProperty('transcript')" not in lines[end]:
                          end += 1
                      if end >= len(lines):
                          raise SystemExit('failed-conversation assertion block did not terminate')
                      output.append(f"{indent}expect(judgeRequest).toEqual({{ user_id: 'demo-user' }});")
                      replaced['failed_conversation'] += 1
                      index = end + 1
                      continue

              if stripped == 'expect(payload).toMatchObject({':
                  preview = '\n'.join(lines[index:index + 8])
                  if (
                      "execution_run_id: 'exec-demo123'" in preview
                      and 'conversation_id: conversation.conversation_id' in preview
                      and "user_id: 'demo-user'" in preview
                  ):
                      indent = line[:len(line) - len(line.lstrip())]
                      end = index
                      while end < len(lines) and lines[end].strip() != '});':
                          end += 1
                      if end >= len(lines):
                          raise SystemExit('adjudication assertion block did not terminate')
                      output.append(f"{indent}expect(payload).toEqual({{ user_id: 'demo-user' }});")
                      replaced['adjudication'] += 1
                      index = end + 1
                      continue

              output.append(line)
              index += 1

          expected = {
              'selected_conversation': 1,
              'adjudication': 1,
              'failed_conversation': 1,
          }
          if replaced != expected:
              raise SystemExit(f'unexpected assertion replacements: {replaced}')

          updated = '\n'.join(output) + '\n'
          if updated.count(new_route) != 4 or old_route in updated:
              raise SystemExit('judge route replacement validation failed')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit targeted test updates
        run: |
          rm .github/workflows/pr130-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/runs-analysis.spec.ts .github/workflows/pr130-review-fixes.yml
          git commit -m "Retarget run-analysis judge specs to ASSERT"
          git push origin HEAD:agent/use-assert-judge-button
