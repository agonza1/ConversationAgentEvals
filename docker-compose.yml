services:
  db:
    image: postgres:16-alpine
    profiles:
      - persistence
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conversation_agent_evals}
      POSTGRES_USER: ${POSTGRES_USER:-cae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cae_local_password}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cae} -d $${POSTGRES_DB:-conversation_agent_evals}"]
      interval: 10s
      timeout: 5s
      retries: 10

  seed:
    image: conversation-agent-evals-api:latest
    profiles:
      - persistence
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cae}:${POSTGRES_PASSWORD:-cae_local_password}@db:5432/${POSTGRES_DB:-conversation_agent_evals}
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.seed"]
    restart: "no"

  api:
    image: conversation-agent-evals-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 8000
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-sqlite:////workspace/storage/conversation_agent_evals.db}
      API_BASE_URL: http://api:8000
      PIPECAT_SERVICE_URL: http://pipecat:8110
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "${API_PORT:-8025}:8000"
      # The Codex OAuth redirect URI is registered as localhost:1455. Keep the
      # host mapping fixed so Compose cannot advertise an unusable callback URL.
      - "1455:1455"
    volumes:
      - ./storage:/workspace/storage
      - ./.local:/workspace/.local
    depends_on:
      db:
        condition: service_healthy
        required: false
      seed:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: conversation-agent-evals-api:latest
    profiles:
      - persistence
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cae}:${POSTGRES_PASSWORD:-cae_local_password}@db:5432/${POSTGRES_DB:-conversation_agent_evals}
      API_BASE_URL: http://api:8000
      PIPECAT_SERVICE_URL: http://pipecat:8110
      APP_ENV: ${APP_ENV:-development}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; p=Path('/tmp/conversation-agent-evals-worker-health'); raise SystemExit(0 if p.exists() and time.time() - p.stat().st_mtime < 90 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  pipecat:
    image: conversation-agent-evals-pipecat:latest
    profiles:
      - voice
    build:
      context: .
      dockerfile: apps/pipecat/Dockerfile
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      PIPECAT_SERVICE_URL: http://pipecat:8110
      RTC_ASR_BASE_URL: ${RTC_ASR_BASE_URL:-}
      RTC_ASR_HEALTH_PATH: ${RTC_ASR_HEALTH_PATH:-/health}
      RTC_ASR_STREAM_PATH: ${RTC_ASR_STREAM_PATH:-/v1/stt/stream}
    ports:
      - "${PIPECAT_PORT:-8110}:8110"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8110/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    image: conversation-agent-evals-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_BASE_URL: http://api:8000
        PIPECAT_SERVICE_URL: http://pipecat:8110
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8025}
        NEXT_PUBLIC_PIPECAT_SERVICE_URL: http://localhost:${PIPECAT_PORT:-8110}
        APP_ENV: ${APP_ENV:-development}
        PRODUCTION: ${PRODUCTION:-false}
    env_file:
      - .env
    environment:
      PORT: 3000
      API_BASE_URL: http://api:8000
      PIPECAT_SERVICE_URL: http://pipecat:8110
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8025}
      NEXT_PUBLIC_PIPECAT_SERVICE_URL: http://localhost:${PIPECAT_PORT:-8110}
    ports:
      - "${PORT:-3012}:3000"
    depends_on:
      api:
        condition: service_healthy
      pipecat:
        condition: service_healthy
        required: false

volumes:
  postgres_data:
