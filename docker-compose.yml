services:
  api:
    image: conversation-agent-evals-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      PIPECAT_SERVICE_URL: http://pipecat:8110
    ports:
      - "${API_PORT:-8025}:8000"
    volumes:
      - ./storage:/workspace/storage
      - ./apps/api/sales_presenter.db:/workspace/apps/api/sales_presenter.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  pipecat:
    image: conversation-agent-evals-pipecat:latest
    build:
      context: .
      dockerfile: apps/pipecat/Dockerfile
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      PIPECAT_SERVICE_URL: http://pipecat:8110
    ports:
      - "${PIPECAT_PORT:-8110}:8110"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8110/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    image: conversation-agent-evals-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_BASE_URL: http://api:8000
        PIPECAT_SERVICE_URL: http://pipecat:8110
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8025}
        NEXT_PUBLIC_PIPECAT_SERVICE_URL: http://localhost:${PIPECAT_PORT:-8110}
        APP_ENV: ${APP_ENV:-development}
        PRODUCTION: ${PRODUCTION:-false}
    env_file:
      - .env
    environment:
      PORT: 3000
      API_BASE_URL: http://api:8000
      PIPECAT_SERVICE_URL: http://pipecat:8110
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8025}
      NEXT_PUBLIC_PIPECAT_SERVICE_URL: http://localhost:${PIPECAT_PORT:-8110}
    ports:
      - "${PORT:-3012}:3000"
    depends_on:
      api:
        condition: service_healthy
      pipecat:
        condition: service_healthy
