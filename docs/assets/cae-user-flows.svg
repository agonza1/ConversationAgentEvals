<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="720" viewBox="0 220 1920 720" role="img" aria-labelledby="title desc">
<title id="title">CAE — ConversationAgentEvals: high-level user flows</title>
<desc id="desc">Three ways to evaluate a conversation agent. Preferred: upload an existing vCon, with no live test required. Alternatively, import transcripts, audio, action traces and state, or select a target and scenario to run a test caller against a supported live voice agent. All evidence is normalized, with gaps flagged, then evaluated against a selected scenario or test suite using scenario-based checks and an optional ASSERT AI judge. Review verdicts and evidence, compare runs for regressions, and export reports, vCons and ASSERT artifacts. Live tests require a supported target adapter.</desc>
<metadata>Source: agonza1/ConversationAgentEvals — README.md; docs/assert-flow-demo.md; docs/assert-boundary-and-schemas.md. High-level product diagram, not a claim of generic SIP/PSTN or arbitrary-URL execution support.</metadata>
